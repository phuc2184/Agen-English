version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agen_english_db
    restart: always
    environment:
      POSTGRES_USER: agen
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: agen_english
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agen_network

networks:
  agen_network:
    driver: bridge

volumes:
  pgdata:
