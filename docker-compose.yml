version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agen_english_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: agen_english
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - agen_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agen_english_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/agen_english?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "3001:3001"
    depends_on:
      - db
    networks:
      - agen_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agen_english_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - agen_network

networks:
  agen_network:
    driver: bridge

volumes:
  pgdata:
